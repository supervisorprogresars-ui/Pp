<!DOCTYPE html>

<html lang="es">
<head>

<meta charset="UTF-8">
<title>Paquetería PRO</title>

<style>

body{
font-family:Arial;
background:#111;
color:white;
padding:10px;
}

input,select,button{
width:100%;
padding:10px;
margin:5px 0;
border-radius:6px;
border:none;
}

button{
background:gold;
}

.card{
background:#222;
padding:10px;
margin-top:10px;
border-radius:10px;
}

.alerta{
color:red;
font-weight:bold;
}

img{
width:100%;
border-radius:10px;
margin-top:5px;
}

</style>

</head>

<body>

<h1>📦 Paquetería PRO</h1>

<audio id="alarma">
<source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<h3>👮 Acceso Guarda</h3>

<select id="conjunto"></select>

<select id="nombreGuarda"></select>

<input id="claveConjunto"
placeholder="Clave conjunto">

<button onclick="loginGuarda()">
Ingresar
</button>

<hr>

<button onclick="loginSupervisor()">
🔐 Supervisor
</button>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push,
onValue,
update,
remove,
set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={

apiKey:"AIzaSyCdYCX_Y5AHmNi9XHmVc_vN7PeBRtpjoXY",

authDomain:"paqueteria-pro.firebaseapp.com",

databaseURL:
"https://paqueteria-pro-default-rtdb.firebaseio.com",

projectId:"paqueteria-pro"

};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

let claveSupervisor="SupervisorPRO2026";


// CARGAR CONJUNTOS

onValue(ref(db,"conjuntos"),snap=>{

let data=snap.val()||{};

conjunto.innerHTML="";

Object.keys(data).forEach(c=>{

let op=document.createElement("option");

op.value=c;
op.textContent=c;

conjunto.appendChild(op);

});

cargarGuardas();

});


// CARGAR GUARDAS (FUNCION CLAVE)

function cargarGuardas(){

let conj=conjunto.value;

onValue(
ref(db,"guardas/"+conj),
snap=>{

let data=snap.val()||{};

nombreGuarda.innerHTML="";

Object.keys(data).forEach(id=>{

let op=document.createElement("option");

op.value=data[id].nombre;

op.textContent=data[id].nombre;

nombreGuarda.appendChild(op);

});

});

}

conjunto.onchange=cargarGuardas;


// LOGIN GUARDA

window.loginGuarda=function(){

if(!nombreGuarda.value){

alert("Seleccione su nombre");

return;

}

let conj=conjunto.value;

let clave=claveConjunto.value;

onValue(
ref(db,"conjuntos/"+conj),
snap=>{

let data=snap.val();

if(data && data.clave===clave){

panelGuarda(
nombreGuarda.value,
conj
);

}else{

alert("Clave incorrecta");

}

},{onlyOnce:true});

};


// PANEL GUARDA

function panelGuarda(nombre,conj){

document.body.innerHTML=`

<h2>👮 ${nombre} - ${conj}</h2>

<button onclick="location.reload()">
Salir
</button>

<input id="torre" placeholder="Torre">
<input id="apartamento" placeholder="Apartamento">
<input id="residente" placeholder="Residente">
<input id="guia" placeholder="Número guía">
<input id="transportadora" placeholder="Transportadora">
<input id="mensajero" placeholder="Nombre mensajero">

<input type="file"
id="foto"
accept="image/*"
capture="environment">

<button onclick="registrar()">
📥 Ingresar paquete
</button>

<h3>📦 Pendientes</h3>

<div id="lista"></div>

`;

onValue(
ref(db,"paquetes/"+conj),
snap=>{

let data=snap.val()||{};

let html="";

Object.keys(data).forEach(id=>{

let p=data[id];

if(p.estado==="Pendiente"){

html+=`

<div class="card">

👤 ${p.residente}<br>

🏢 ${p.torre}-${p.apartamento}<br>

📦 ${p.guia}<br>

🚚 ${p.transportadora}<br>

🧍 ${p.mensajero}<br>

🕓 ${p.fechaEntrada}<br>

👮 Recibe:
${p.guardaRecibe}<br>

${p.foto ? `<img src="${p.foto}">`:""}

<button onclick="entregar('${conj}','${id}')">
📤 Dar salida
</button>

</div>

`;

}

});

lista.innerHTML=html;

});


// REGISTRAR

window.registrar=function(){

if(!torre.value ||
!apartamento.value ||
!residente.value ||
!guia.value ||
!transportadora.value ||
!mensajero.value){

alert("Complete todos los campos");

return;

}

let archivo=foto.files[0];

let reader=new FileReader();

reader.onload=function(e){

guardar(e.target.result);

};

if(archivo){

reader.readAsDataURL(archivo);

}else{

guardar("");

}

function guardar(img){

let p={

residente:residente.value,
torre:torre.value,
apartamento:apartamento.value,
guia:guia.value,
transportadora:transportadora.value,
mensajero:mensajero.value,
foto:img,

guardaRecibe:nombre,

fechaEntrada:
new Date().toLocaleString(),

estado:"Pendiente"

};

push(ref(db,"paquetes/"+conj),p);

}

};


// ENTREGA

window.entregar=function(c,id){

let persona=
prompt("Nombre persona que recibe:");

if(!persona) return;

update(
ref(db,"paquetes/"+c+"/"+id),
{

estado:"Entregado",

personaRecibe:persona,

guardaEntrega:nombre,

fechaEntrega:
new Date().toLocaleString()

}

);

};

}


// LOGIN SUPERVISOR

window.loginSupervisor=function(){

let clave=
prompt("Clave supervisor");

if(clave===claveSupervisor){

panelSupervisor();

}

};


// PANEL SUPERVISOR (CON GUARDAS)

function panelSupervisor(){

document.body.innerHTML=`

<h2>🔐 Supervisor</h2>

<button onclick="location.reload()">
Salir
</button>

<h3>➕ Crear Conjunto</h3>

<input id="nuevoConjunto"
placeholder="Nombre conjunto">

<input id="claveNuevo"
placeholder="Clave conjunto">

<button onclick="crearConjunto()">
Crear conjunto
</button>

<h3>➕ Agregar Guarda</h3>

<input id="conjuntoGuarda"
placeholder="Nombre conjunto">

<input id="nombreGuardaNuevo"
placeholder="Nombre guarda">

<button onclick="agregarGuarda()">
Guardar guarda
</button>

<h3>❌ Eliminar Guarda</h3>

<input id="conjuntoEliminar"
placeholder="Nombre conjunto">

<input id="nombreEliminar"
placeholder="Nombre guarda">

<button onclick="eliminarGuarda()">
Eliminar guarda
</button>

`;


// CREAR CONJUNTO

window.crearConjunto=function(){

set(
ref(db,
"conjuntos/"+nuevoConjunto.value),
{

clave:claveNuevo.value

}

);

};


// AGREGAR GUARDA

window.agregarGuarda=function(){

let id="g"+Date.now();

update(
ref(db,
"guardas/"+conjuntoGuarda.value),
{

[id]:
{nombre:nombreGuardaNuevo.value}

}

);

alert("Guarda guardado");

};


// ELIMINAR GUARDA

window.eliminarGuarda=function(){

onValue(
ref(db,
"guardas/"+conjuntoEliminar.value),
snap=>{

let data=snap.val()||{};

Object.keys(data).forEach(id=>{

if(
data[id].nombre
===nombreEliminar.value){

remove(
ref(db,
"guardas/"+conjuntoEliminar.value+"/"+id)
);

}

});

},{onlyOnce:true});

};

}

</script>

</body>
</html>
